name: CI

on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: '0 3 * * *'   # nightly golden run

env:
  CARGO_TERM_COLOR: always
  LEARNLIVE_MODELS: ${{ github.workspace }}/.models

jobs:
  # Tier 1 — every push/PR. No models, no audio hardware: logic only.
  unit:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@v0.12.0
        with: { enable-cache: true }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # ort and sherpa-rs-sys download their native libraries here and record the
          # paths as -L flags in their build-script output. That output lives in target/
          # and is cached; these directories were not, so on a cache hit the build script
          # did not rerun, nothing re-downloaded, and linking failed against -L paths that
          # no longer existed. They have to be cached together or not at all.
          cache-directories: |
            ~/Library/Caches/ort.pyke.io
            ~/Library/Caches/sherpa-rs
      - run: devbox run -- npm ci
      - run: devbox run -- just test

  # Tier 2 — nightly or on the "golden" label. Real models, real audio, threshold asserts.
  golden:
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'golden')
    runs-on: macos-14
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@v0.12.0
        with: { enable-cache: true }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # ort and sherpa-rs-sys download their native libraries here and record the
          # paths as -L flags in their build-script output. That output lives in target/
          # and is cached; these directories were not, so on a cache hit the build script
          # did not rerun, nothing re-downloaded, and linking failed against -L paths that
          # no longer existed. They have to be cached together or not at all.
          cache-directories: |
            ~/Library/Caches/ort.pyke.io
            ~/Library/Caches/sherpa-rs
      - uses: actions/cache@v4
        with:
          path: ${{ env.LEARNLIVE_MODELS }}
          key: models-${{ hashFiles('src-tauri/src/models.rs') }}
      - run: devbox run -- just models
      - run: devbox run -- just fixtures
      - run: devbox run -- just golden
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: golden-fixtures, path: src-tauri/fixtures/*.wav, retention-days: 3 }

  # Tier 3 — does it bundle? (PRs only; releases build in release-please.yml)
  build:
    if: github.event_name == 'pull_request'
    runs-on: macos-14
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@v0.12.0
        with: { enable-cache: true }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # ort and sherpa-rs-sys download their native libraries here and record the
          # paths as -L flags in their build-script output. That output lives in target/
          # and is cached; these directories were not, so on a cache hit the build script
          # did not rerun, nothing re-downloaded, and linking failed against -L paths that
          # no longer existed. They have to be cached together or not at all.
          cache-directories: |
            ~/Library/Caches/ort.pyke.io
            ~/Library/Caches/sherpa-rs
      - run: devbox run -- just setup
      - run: devbox run -- just build
