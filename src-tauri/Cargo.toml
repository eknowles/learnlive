[package]
name = "learnlive"
version = "0.2.2"
description = "Live translation, speaker detection and grammar coaching for video calls"
authors = ["Ed Knowles"]
edition = "2021"
rust-version = "1.77"
default-run = "learnlive"

[lib]
name = "learnlive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "fs"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Audio: capture from any CoreAudio/WASAPI/ALSA device (BlackHole, mic, aggregate devices)
cpal = "0.15"
rubato = "0.15"          # high-quality resampling to 16 kHz mono
ringbuf = "0.4"

# Speech stack: VAD, ASR (Whisper / SenseVoice), speaker embeddings, TTS — all ONNX, all offline.
# sherpa-rs wraps sherpa-onnx; "download-binaries" pulls prebuilt libsherpa-onnx at build time.
sherpa-rs = { version = "0.6", features = ["download-binaries"] }

# Machine translation (NLLB-200) and POS tagging via ONNX Runtime
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
ndarray = "0.17"   # must match the ndarray ort re-exports

# Model download / cache
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
sha2 = "0.10"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Local history: SQLite with FTS5, bundled so there's no system dependency
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Calendar via EventKit (no Tauri plugin exists for it; the bridge is in src/calendar.rs)
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSDate", "NSString", "NSArray", "NSURL", "NSError", "NSObject", "NSPredicate"] }
objc2-event-kit = { version = "0.2", features = ["EKEventStore", "EKEvent", "EKCalendar", "EKCalendarItem", "EKObject", "EKParticipant", "EKTypes", "block2"] }
block2 = "0.5"

[[bin]]
name = "learnlive"
path = "src/main.rs"

[[bin]]
name = "fixture-gen"
path = "src/bin/fixture-gen.rs"

[[bin]]
name = "model-fetch"
path = "src/bin/model-fetch.rs"

[[bin]]
name = "bench-latency"
path = "src/bin/bench-latency.rs"

[features]
default = []
# Embed model files into the binary (large!). Off by default; models are fetched to the app data dir on first run.
bundled-models = []

# The prebuilt libonnxruntime.a (ort "download-binaries") carries KleidiAI assembly whose labels
# are not 4-byte aligned; ld prints hundreds of "arm64 function not 4-byte aligned" lines per link.
# They are harmless and not ours to fix, so keep them out of every `cargo build`.
[lints.rust]
linker_messages = "allow"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
